# JVM args for the Gradle daemon. 2g is plenty for a single-module app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX is mandatory for modern AGP.
android.useAndroidX=true
# Non-transitive R classes: smaller, faster, the modern default.
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP 9.0+ defaults and recommendations
android.newDsl=true
android.builtInKotlin=true
android.uniquePackageNames=true
android.enableAppCompileTimeRClass=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
android.defaults.buildfeatures.resvalues=true
